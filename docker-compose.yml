version: '3.8'

services:
  kymuskie:
    build: .
    container_name: kymuskie-site
    networks:
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kymuskie.rule=Host(`kymuskie.advancedmarketing.co`)"
      - "traefik.http.routers.kymuskie.entrypoints=websecure"
      - "traefik.http.routers.kymuskie.tls.certResolver=letsencrypt"
      - "traefik.http.services.kymuskie.loadbalancer.server.port=80"

networks:
  coolify:
    external: true
